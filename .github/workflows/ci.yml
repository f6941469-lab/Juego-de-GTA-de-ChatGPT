name: Verificar Viceblock
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Comprobar entrega portable actualizada
        run: git diff --exit-code -- jugar/index.html publicar/viceblock-itch.zip
      - uses: actions/upload-artifact@v4
        with:
          name: viceblock-portable
          path: jugar/index.html
          if-no-files-found: error
